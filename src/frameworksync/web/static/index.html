<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>FrameworkSync</title>
<style>
  :root {
    --bg: #0f1117;
    --panel: #171a23;
    --border: #2a2e3a;
    --text: #e4e6eb;
    --muted: #8b8fa3;
    --warn: #e0a030;
    --ok: #3fb950;
    --accent: #6ea8fe;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  header {
    padding: 20px 28px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  header h1 { font-size: 18px; margin: 0; font-weight: 600; }
  #status {
    font-size: 13px;
    color: var(--muted);
    display: flex;
    align-items: center;
    gap: 6px;
  }
  #status .dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--muted);
  }
  #status.connected .dot { background: var(--ok); }
  main {
    padding: 24px 28px;
    max-width: 900px;
    margin: 0 auto;
  }
  #empty {
    color: var(--muted);
    text-align: center;
    padding: 60px 0;
    font-size: 14px;
  }
  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px 20px;
    margin-bottom: 12px;
    animation: slidein 0.2s ease-out;
  }
  @keyframes slidein {
    from { opacity: 0; transform: translateY(-6px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .card .path {
    font-size: 13px;
    color: var(--muted);
    margin-bottom: 8px;
    word-break: break-all;
  }
  .card .clean {
    color: var(--ok);
    font-size: 14px;
  }
  .issue {
    display: flex;
    gap: 10px;
    padding: 8px 0;
    border-top: 1px solid var(--border);
  }
  .issue:first-of-type { border-top: none; }
  .issue .badge {
    color: var(--warn);
    font-size: 16px;
    flex-shrink: 0;
  }
  .issue .detail { font-size: 14px; line-height: 1.5; }
  .issue .line-no { color: var(--accent); font-weight: 600; }
  .issue code {
    background: #1e2230;
    padding: 1px 5px;
    border-radius: 4px;
    font-size: 13px;
  }
  .issue .source {
    color: var(--muted);
    font-size: 12px;
    margin-top: 2px;
  }
</style>
</head>
<body>

<header>
  <h1>FrameworkSync</h1>
  <div id="status"><span class="dot"></span><span id="status-text">connecting...</span></div>
</header>

<main>
  <div id="empty">Waiting for a file save...</div>
  <div id="feed"></div>
</main>

<script>
const feed = document.getElementById("feed");
const empty = document.getElementById("empty");
const statusEl = document.getElementById("status");
const statusText = document.getElementById("status-text");

function connect() {
  const ws = new WebSocket(`ws://${location.host}/ws`);

  ws.onopen = () => {
    statusEl.classList.add("connected");
    statusText.textContent = "live";
  };

  ws.onclose = () => {
    statusEl.classList.remove("connected");
    statusText.textContent = "disconnected — retrying...";
    setTimeout(connect, 1500);  // auto-reconnect if the server restarts
  };

  ws.onmessage = (event) => {
    const data = JSON.parse(event.data);
    renderResult(data);
  };
}

const cardsByPath = new Map();
function esc(v) {
  return String(v ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

function renderResult(data) {
  empty.style.display = "none";

  const card = document.createElement("div");
  card.className = "card";

  const pathEl = document.createElement("div");
  pathEl.className = "path";
  pathEl.textContent = data.path;
  card.appendChild(pathEl);

  if (data.error) {
    const p = document.createElement("div");
    p.className = "clean";
    p.style.color = "var(--warn)";
    p.textContent = data.error;
    card.appendChild(p);
  } else if (data.issues.length === 0) {
    const p = document.createElement("div");
    p.className = "clean";
    p.textContent = data.libraries.length
      ? `No known deprecated patterns found. (${data.libraries.join(", ")})`
      : "No tracked frameworks used.";
    card.appendChild(p);
  } else {
    for (const issue of data.issues) {
      const row = document.createElement("div");
      row.className = "issue";
      row.innerHTML = `
        <span class="badge">&#9888;</span>
        <div class="detail">
          <span class="line-no">Line ${issue.line}:</span>
          <code>${esc(issue.old_pattern)}</code> is deprecated &rarr;
          use <code>${esc(issue.new_pattern)}</code>
          <div class="source">${esc(issue.library)} &middot; ${esc(issue.source_name)}</div>
        </div>
      `;
      card.appendChild(row);
    }
  }
  for (const suggestion of (data.suggestions || [])) {
    const row = document.createElement("div");
    row.className = "issue";
    row.innerHTML = `
      <span class="badge" style="color: var(--accent);">&#128161;</span>
      <div class="detail">
        <span class="line-no">Line ${suggestion.line}:</span>
        ${esc(suggestion.description)}
        <div style="margin-top:4px; color: var(--muted);">${esc(suggestion.explanation)}</div>
        <div class="source">${esc((suggestion.sources || []).join(", "))}</div>
      </div>
    `;
    card.appendChild(row);
  }
  

  const previous = cardsByPath.get(data.path);
  if (previous) previous.replaceWith(card);   // same file: update in place
  else feed.prepend(card);                    // new file: newest on top
  cardsByPath.set(data.path, card);
}

connect();
</script>

</body>
</html>
